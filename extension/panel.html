<!doctype html>
<meta charset="utf-8">
<title>Agent trace</title>
<style>
  body { font: 13px system-ui; margin: 0; padding: 12px; background: #111; color: #eee; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #888; margin: 16px 0 6px; }
  img { width: 100%; border-radius: 4px; display: block; background: #222; min-height: 40px; }
  pre { background: #1b1b1b; padding: 8px; border-radius: 4px; overflow-x: auto; font-size: 11px; }
  #stats { color: #9fd; font-size: 12px; margin: 8px 0 0; }
  #detail { color: #777; font-size: 11px; margin: 2px 0 0; }
  #run { width: 100%; padding: 10px; font: 600 13px system-ui; color: #06231a;
         background: #4ade80; border: 0; border-radius: 4px; cursor: pointer; }
  #run:disabled { background: #444; color: #999; cursor: default; }
  #status { color: #e88; font-size: 11px; margin: 6px 0 0; min-height: 13px; }
</style>
<button id="run">Perceive and redact this page</button>
<p id="status"></p>
<h2>Masked view</h2>
<img id="masked" alt="masked capture">
<p id="stats"></p>
<p id="detail"></p>
<h2>Sent to server</h2>
<pre id="payload">nothing sent yet</pre>
<script type="module" src="panel.js"></script>
